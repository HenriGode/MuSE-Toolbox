defaults:
  - dataset: ami
  - model: osc
  - transform: default
  - trainer: default
  - logger: wandb
  - callbacks: default
  - task: null
  - _self_
  - experiment: null

# Global settings
task: source_counting
experiment_name: default_exp
train: True
test: True
# Optional separate or multi-dataset testing list/dict (e.g. [ami, brudex, pra_anf_circ_8ch]).
# When null, testing runs on the primary `dataset` above.
test_datasets: null
predict: False
predictions_dir: null

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data

hydra:
  run:
    dir: ${paths.root_dir}/outputs/${task}/${experiment_name}/${logger.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${paths.root_dir}/outputs/${task}/${experiment_name}/multirun/${logger.name}
    subdir: ${hydra.job.num}
  output_subdir: logging/.hydra
