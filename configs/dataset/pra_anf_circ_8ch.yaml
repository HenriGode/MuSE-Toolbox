# configs/dataset/pra_anf_circ_8ch.yaml
# PRA_ANF Dataset: Uniform Circular Array with 8 Microphones (radius 10 cm, 20 cm diameter)

defaults:
  - base_pra_anf

id: "J3_PRAANF_circ_8ch_20cm_SIR10dB"

pra_anf_config:
  microphone_arrays:
    - num_mics: 8
      geometry: circle
      distribution: regular
      radius: 0.1 # 10 cm radius (20 cm diameter)
      rotation: random
      restrict_rot_2_xy_plane: True
      fix_height: 1.5
