# configs/dataset/pra_anf_circ_2-8ch.yaml
# PRA_ANF Dataset: Circular Array with Random 2-8 Microphones

defaults:
  - base_pra_anf

id: "J3_PRAANF_circ_2-8ch_20cm_SIR10dB"

pra_anf_config:
  microphone_arrays:
    - num_mics: 
        min: 2
        max: 8
      geometry: circle
      distribution: regular
      radius: 0.1
      rotation: random
      restrict_rot_2_xy_plane: True
      fix_height: 1.5
