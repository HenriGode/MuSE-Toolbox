# configs/dataset/pra_anf_rand_8ch.yaml
# PRA_ANF Dataset: Random Planar Array with 8 Microphones in a 20x20 cm square area

defaults:
  - base_pra_anf

id: "J3_PRAANF_rand_8ch_20cm_SIR10dB"
precomputed_id: null
mic_count_probs:
  8: 1.0

pra_anf_config:
  microphone_arrays:
    - num_mics: 8
      geometry: square_area
      distribution: random
      max_distance: 0.20 # 20x20 cm square bounding box
      min_distance: 0.02 # 2 cm minimum inter-microphone distance
      rotation: random
      restrict_rot_2_xy_plane: True
      fix_height: 1.5
