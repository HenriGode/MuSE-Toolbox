# configs/dataset/pra_anf_rand_2-8ch.yaml
# PRA_ANF Dataset: Random Geometry Array with Random 2-8 Microphones

defaults:
  - base_pra_anf

id: "J3_PRAANF_rand_2-8ch"

pra_anf_config:
  microphone_arrays:
    - num_mics: 
        min: 2
        max: 8
      geometry: square_area
      distribution: random
      max_distance: 0.10 # 10x10cm bounding box
      min_distance: 0.01 # 1cm minimum distance between mics
      rotation: random
      restrict_rot_2_xy_plane: True
      fix_height: 1.5
