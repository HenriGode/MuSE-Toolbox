# configs/dataset/base_dataset.yaml
# Universal parameters shared by all datasets (simulated and real-world).

data_dir: ${paths.data_dir}
batch_size: 16
num_workers: 0
seed: 777
acc_device: "cpu"

# Even real-world datasets like AMI will be resampled to this target
sampling_frequency: ${transform.sampling_frequency}

# Triggers recalculation/recomputation of the precomputed dataset features
reset: False

# Optional shared parent dataset folder ID (e.g., Rand3-8 reusing precomputed Rand8 scenarios)
precomputed_id: null

# Optional discrete probability distribution over mic counts M in {1..8} (sums to 1.0)
mic_count_probs: null

# Optional single-channel stream override (null: auto-enabled by pipeline for 1-ch models)
single_channel_expansion: null

# Global STFT transform injected from the main config space
transform: ${transform}

# Chunking and Inference Parameters
# Cornell defaults: 5.0 s training chunks (2.5 s overlap), 3.0 s eval sliding window (1.5 s / 50% overlap).
# For causal 7.0 s / 2.0 s burn-in chunking, set chunk_length_s: 7.0, min_context_s: 2.0,
# eval_chunk_length_s: 7.0, eval_min_context_s: 2.0.
chunk_length_s: 5.0
min_context_s: 2.5
eval_chunk_length_s: 3.0
eval_min_context_s: 1.5
train_items_per_epoch: null # null auto-computes 100% unique corpus duration per epoch

# Data Augmentation Config (disabled by default, specific logic in AMI)
augmentation:
  enabled: false
